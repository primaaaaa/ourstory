<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scrapbook 3D Flip</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playpen+Sans+Thai:wght@100..800&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="book-container">
      <div id="book" class="book">
        <div id="p1" class="paper">
          <div class="front">
            <div class="front-content">
              <img src="pages/1.png" alt="Cover" class="page-image" />
              <!-- <div class="page-text">My Scrapbook</div> -->
            </div>
          </div>
          <div class="back">
            <div class="back-content">
              <!-- <img src="https://images.unsplash.com/photo-1500835556837-99ac94a94552?w=500" alt="Foto 1" class="page-image" /> -->
              <!-- <div class="page-text">First Trip</div> -->
            </div>
          </div>
        </div>

        <div id="p2" class="paper">
          <div class="front">
            <div class="front-content">
              <img src="pages/2.png" alt="Foto 2" class="page-image" />
              <!-- <div class="page-text">Road Trip</div> -->
            </div>
          </div>
          <div class="back">
            <div class="back-content">
              <img src="pages/3.png" alt="Foto 3" class="page-image" />
              <!-- <div class="page-text">Mountains</div> -->
            </div>
          </div>
        </div>

        <div id="p3" class="paper">
          <div class="front">
            <div class="front-content">
              <img src="pages/4.png" alt="Foto 4" class="page-image" />
              <!-- <div class="page-text">Memories</div> -->
            </div>
          </div>

          <div class="back">
            <div class="back-content">
              <img src="pages/5.png" alt="Back Cover" class="page-image" />
              <!-- <div class="page-text">The End.</div> -->
            </div>
          </div>
        </div>

        <div id="p4" class="paper">
          <div class="front">
            <div class="front-content" style="flex-direction: column; text-align: center; padding: 20px">
              <h2 style="color: #004aad; margin-bottom: 15px">Been loving you for:</h2>
              <div id="love-timer" class="timer-text">Menghitung...</div>
            </div>
          </div>

          <div class="back">
            <div class="back-content">
              <img src="pages/7.png" alt="Back Cover" class="page-image" />
              <!-- <div class="page-text">The End.</div> -->
            </div>
          </div>
        </div>

        <div id="p5" class="paper">
          <div class="front">
            <div class="front-content">
              <img src="pages/8.png" alt="Foto 4" class="page-image" />
              <!-- <div class="page-text">Memories</div> -->
            </div>
          </div>

          <div class="back">
            <div class="back-content">
              <img src="pages/9.png" alt="Back Cover" class="page-image" />
              <!-- <div class="page-text">The End.</div> -->
            </div>
          </div>
        </div>

        <div id="p6" class="paper">
          <div class="front">
            <div class="front-content">
              <img src="pages/Reminder.png" alt="Foto 4" class="page-image" />
              <!-- <div class="page-text">Memories</div> -->
            </div>
          </div>

          <div class="back">
            <div class="back-content">
              <img src="pages/10.png" alt="Back Cover" class="page-image" />
              <!-- <div class="page-text">The End.</div> -->
            </div>
          </div>
        </div>
      </div>

      <div class="controls">
        <button id="prev-btn">
          <i class="bi bi-arrow-left-circle-fill"></i>
        </button>
        <button id="next-btn">
          <i class="bi bi-arrow-right-circle-fill"></i>
        </button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
